[project]
name = "ovenmitt"
version = "0.3.0"
description = "Client library and MCP server for the ovenmitt write-only vault daemon."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
# The base package is the client library and needs only httpx, so it installs
# beside any MCP version an agent image already pins. `ovenmitt mcp` needs the
# `mcp` extra: pip install 'ovenmitt[mcp]'.
dependencies = [
    "httpx>=0.28",
]

[project.scripts]
ovenmitt = "ovenmitt.cli:main"

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ovenmitt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
