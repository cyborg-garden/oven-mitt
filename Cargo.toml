[package]
name = "ovenmitt"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Handle the hot thing without touching it: a write-only vault daemon so agents can move data they must never read."
license = "AGPL-3.0-only"
repository = "https://github.com/utunga/oven-mitt"
publish = false

[[bin]]
name = "ovenmitt"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
toml = "1.1.8"
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# pedantic lints that fight readability more than they help here
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
