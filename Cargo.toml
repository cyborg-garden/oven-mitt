[package]
name = "ovenmitt"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
description = "Handle the hot thing without touching it: a write-only vault daemon so agents can move data they must never read."
license = "AGPL-3.0-only"
# FIXME: move to cyborg-garden/oven-mitt as soon as that is fixed (DEVELOPMENT.md §13)
repository = "https://github.com/utunga/oven-mitt"
publish = false

[[bin]]
name = "ovenmitt"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "matched-path"] }
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
hex = "0.4.3"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "sync", "macros", "net", "io-util", "fs", "signal", "time"] }
tokio-stream = "0.1.19"
toml = "1.1.8"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.25"
zeroize = "1.9.1"

[dev-dependencies]
getrandom = "0.4.3"
hex = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# pedantic lints that fight readability more than they help here
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
