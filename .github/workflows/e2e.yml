name: e2e
on:
  push:
    branches: [tumu]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t ovenmitt:ci .
      - run: docker run --rm ovenmitt:ci --version
      - run: docker run --rm ovenmitt:ci config check
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --project python --all-extras
      - run: uv run --project python pytest tests-e2e -q
