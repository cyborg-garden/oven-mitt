name: python
on:
  push:
    branches: [tumu]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --project python --all-extras
      - run: uv run --project python pytest python/tests -q
