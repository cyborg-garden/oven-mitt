name: python
on:
  push:
    branches: [tumu]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master as of 2026-10-16
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --project python --all-extras
      - run: uv run --project python pytest python/tests -q
      # the bridge; its harness contract test skips without the harness installed
      - run: uv run --project python pytest tests-plugin -q
