name: rust
on:
  push:
    branches: [tumu]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master as of 2026-10-16
        with:
          toolchain: "1.99.0"   # pinned: clippy lints change between releases
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      # the example config's fs root must exist for the check to pass
      - run: sudo mkdir -p /var/lib/ovenmitt/export/archive
      - run: cargo run -- config check docker/example/ovenmitt.toml
